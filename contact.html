<body>

    <header>
        <nav>
            <a href="index.html">Home</a>

<script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('Support me on Ko-fi', '#72a4f2', 'A5S425QX90');kofiwidget2.draw();</script> 
        <h1>XVS Design</h1>
        <p class="subtitle">Let's Work Together!</p>
        
        <div class="contact-email">
            <p style="color: var(--text-color); font-size: 0.95rem;">
                Have a project in mind, need a commission, or just want to say hello? Drop a message below!
            </p>
        </div>
    </header>

    <main>
        <!-- Formulaire inséré dans le conteneur stylisé du CSS -->
     <section class="contact-container">
            <form action="https://formspree.io/f/xpqvrdbg" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
                
                <div style="display: flex; flex-direction: column; text-align: left; gap: 0.4rem;">
                    <label for="name" style="color: var(--accent-color); font-weight: 600; font-size: 0.9rem; text-transform: uppercase;">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required style="background: #0d0d11; color: var(--text-color); border: 1px solid #282838; padding: 0.75rem 1rem; border-radius: 6px; font-family: inherit; font-size: 0.95rem;">
                </div>

                <div style="display: flex; flex-direction: column; text-align: left; gap: 0.4rem;">
                    <label for="email" style="color: var(--accent-color); font-weight: 600; font-size: 0.9rem; text-transform: uppercase;">Email</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required style="background: #0d0d11; color: var(--text-color); border: 1px solid #282838; padding: 0.75rem 1rem; border-radius: 6px; font-family: inherit; font-size: 0.95rem;">
                </div>

                <div style="display: flex; flex-direction: column; text-align: left; gap: 0.4rem;">
                    <label for="subject" style="color: var(--accent-color); font-weight: 600; font-size: 0.9rem; text-transform: uppercase;">Project Type</label>
                    <select id="subject" name="subject" style="background: #0d0d11; color: var(--text-color); border: 1px solid #282838; padding: 0.75rem 1rem; border-radius: 6px; font-family: inherit; font-size: 0.95rem;">
                        <option value="TCG-card game">TCG / Card Game Illustration</option>
                        <option value="book-cover">Custom Book Cover Illustration</option>
                        <option value="dark-fantasy">Dark Fantasy Concept / Scene</option>
                        <option value="landscape">Environment & Landscape Art</option>
                        <option value="other">Other Creative Project</option>
                    </select>
                </div>

                <div style="display: flex; flex-direction: column; text-align: left; gap: 0.4rem;">
                    <label for="message" style="color: var(--accent-color); font-weight: 600; font-size: 0.9rem; text-transform: uppercase;">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Tell me about your project ideas, timeline, and budget..." required style="background: #0d0d11; color: var(--text-color); border: 1px solid #282838; padding: 0.75rem 1rem; border-radius: 6px; font-family: inherit; font-size: 0.95rem; resize: vertical;"></textarea>
                </div>

                <input type="hidden" name="_subject" value="New message from XVS Design">
                <input type="hidden" name="_next" value="https://xvs-design.fr/contact.html?success=true">

                <button type="submit" class="filter-btn active" style="margin-top: 0.5rem; width: 100%; font-size: 1rem; padding: 0.75rem; border-radius: 6px; cursor: pointer;">
                    Send Message
                </button>
            </form>

            <!-- Réseaux Sociaux & Contact Direct -->
            <div style="margin-top: 2.5rem; text-align: center; border-top: 1px solid #282838; padding-top: 1.5rem;">
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Or connect with me directly:</p>
                <div class="contact-email" style="display: flex; justify-content: center; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 0;">
                    <a href="https://www.instagram.com/xv_s_design/" target="_blank">Instagram</a>
                    <a href="https://x.com/BlancJulia" target="_blank">X / Twitter</a>
                    <a href="https://www.artstation.com/juliablanchard9" target="_blank">ArtStation</a>
                    <a href="mailto:blanc.julia@gmail.com">Direct Email</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 XVS Design — All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
