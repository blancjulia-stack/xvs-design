<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Training, sketches, animal studies, landscapes, and art direction briefs by XVS Design.">
    <title>Training & Sketches | XVS Design</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Styles pour la lightbox avec panneau de zoom latéral */
        .lightbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 90vw;
            height: 80vh;
            max-width: 1400px;
        }

        .lightbox-img-container {
            position: relative;
            width: 75%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .zoom-lens {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px solid var(--accent-color, #ff4444);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
            display: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .zoom-panel {
            width: 25%;
            height: 100%;
            max-height: 500px;
            border: 2px solid var(--accent-color, #ff4444);
            border-radius: 8px;
            background-repeat: no-repeat;
            background-color: #111;
            display: none;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="digital.html">Portfolio</a>
            <a href="fan-art.html">Fan Art</a>
            <a href="entrainement.html" class="active">Training</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <h1>Training & Sketches</h1>
        <p class="subtitle">Studies, Animal Anatomy, Landscapes & Art Direction Briefs</p>
    </header>

    <main>
        <section class="portfolio-grid">
            <!-- (Tes cards restent ici, inchangées) -->
            <div class="card"><span class="card-tag">Brief</span><img src="asset/entrainement/DA-001.jpg" alt="Brief"><div class="card-info"><div class="card-title">Brief Study I</div></div></div>
            <div class="card"><span class="card-tag">Brief</span><img src="asset/entrainement/DA-002.jpg" alt="Brief"><div class="card-info"><div class="card-title">Brief Study II</div></div></div>
            <!-- ... ajoute les autres cards ici ... -->
        </section>
    </main>

    <!-- Lightbox Modifiée -->
    <div id="lightbox" class="lightbox">
        <button class="btn-back" id="btn-back">&larr; Retour</button>
        <div class="lightbox-wrapper">
            <div class="lightbox-img-container" id="lightbox-container">
                <img class="lightbox-img" id="lightbox-img" alt="Enlarged view">
                <div id="zoom-lens" class="zoom-lens"></div>
            </div>
            <div id="zoom-panel" class="zoom-panel"></div>
        </div>
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const backBtn = document.getElementById('btn-back');
      const container = document.getElementById('lightbox-container');
      const lens = document.getElementById('zoom-lens');
      const zoomPanel = document.getElementById('zoom-panel');

      const ZOOM_LEVEL = 4; // Facteur de grossissement

      // Ouverture
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
          const img = card.querySelector('img');
          const title = card.querySelector('.card-title');
          lightbox.style.display = 'flex';
          lightboxImg.src = img.src;
          lightboxCaption.innerText = title.innerText;
          document.body.style.overflow = 'hidden';
        });
      });

      // Fermeture
      const closeLightbox = () => {
        lightbox.style.display = 'none';
        document.body.style.overflow = 'auto';
        lens.style.display = 'none';
        zoomPanel.style.display = 'none';
      };

      backBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('lightbox-wrapper')) closeLightbox();
      });

      // Script Zoom Latéral
      container.addEventListener('mousemove', (e) => {
        const rect = lightboxImg.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
          lens.style.display = 'none';
          zoomPanel.style.display = 'none';
          return;
        }

        lens.style.display = 'block';
        zoomPanel.style.display = 'block';

        const lensWidth = lens.offsetWidth;
        lens.style.left = `${e.clientX - container.getBoundingClientRect().left - (lensWidth / 2)}px`;
        lens.style.top = `${e.clientY - container.getBoundingClientRect().top - (lens.offsetHeight / 2)}px`;

        zoomPanel.style.backgroundImage = `url("${lightboxImg.src}")`;
        zoomPanel.style.backgroundSize = `${rect.width * ZOOM_LEVEL}px ${rect.height * ZOOM_LEVEL}px`;

        const bgX = (x * ZOOM_LEVEL) - (zoomPanel.offsetWidth / 2);
        const bgY = (y * ZOOM_LEVEL) - (zoomPanel.offsetHeight / 2);
        zoomPanel.style.backgroundPosition = `-${bgX}px -${bgY}px`;
      });

      container.addEventListener('mouseleave', () => {
        lens.style.display = 'none';
        zoomPanel.style.display = 'none';
      });
    </script>
</body>
</html>
