        <!-- Top Section divided into two halves -->
        <div class="split-container">
            
            <!-- LEFT HALF: DARK FANTASY -->
            <section class="split-half dark-fantasy-zone">
                <div class="zone-header">
                    <h2>Dark Fantasy</h2>
                    <p>univers sombre, demoniaque et rude.</p>
                </div>
                <div class="digital-grid">
                     <div class="artwork-item">
                        <img src="/asset/digital/222.jpg" alt="Dark Fantasy 001" class="zoomable">
                    </div>
                     <div class="artwork-item">
                        <img src="/asset/digital/444.png" alt="Dark Fantasy 001" class="zoomable">
                    </div>
                     <div class="artwork-item">
                        <img src="/asset/digital/dark-fantasy-001.jpg" alt="Dark Fantasy 001" class="zoomable">

                    <div class="artwork-item">
                        <img src="/asset/digital/dark-fantasy-002.jpg" alt="Dark Fantasy 001" class="zoomable">
                    </div>
                    <div class="artwork-item">

                    </div>
                </div>
            </section>

            <!-- RIGHT HALF: SWEET FANTASY -->
            <section class="split-half sweet-fantasy-zone">
                <div class="zone-header">
                    <h2>Sweet Fantasy</h2>
                    <p>Bonne ambiance, douceurs et mignoneries.</p>
                </div>
                <div class="digital-grid">
                    <div class="artwork-item">
                        <img src="/asset/digital/sweet_fantasy-001.jpg" alt="Sweet Fantasy 001" class="zoomable">
                    </div>
                    <div class="artwork-item">
                        <img src="/asset/digital/sweet_fantasy-002.jpg" alt="Sweet Fantasy 002" class="zoomable">

            </section>

        </div>

            <div class="zone-header">
                <h2>Fantasy</h2>

            <div class="digital-grid-large">
